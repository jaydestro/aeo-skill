<svg xmlns="http://www.w3.org/2000/svg" width="660" height="150" viewBox="0 0 660 150" role="img" aria-labelledby="title description">
  <title id="title">Fictional Sprocket grouping example</title>
  <desc id="description">Twelve imaginary items form three groups of four: items 1 to 4, 5 to 8, and 9 to 12. The simulator only calculates the batch count.</desc>
  <rect width="660" height="150" fill="#ffffff"/>
  <g fill="#e8f0ff" stroke="#2453a6" stroke-width="2">
    <rect x="20" y="35" width="190" height="75" rx="8"/>
    <rect x="235" y="35" width="190" height="75" rx="8"/>
    <rect x="450" y="35" width="190" height="75" rx="8"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">
    <text x="115" y="65">Batch 1</text>
    <text x="115" y="92">Items 1-4</text>
    <text x="330" y="65">Batch 2</text>
    <text x="330" y="92">Items 5-8</text>
    <text x="545" y="65">Batch 3</text>
    <text x="545" y="92">Items 9-12</text>
    <text x="330" y="135">Fictional illustration: 12 items / 4 per batch = 3 batches</text>
  </g>
</svg>
